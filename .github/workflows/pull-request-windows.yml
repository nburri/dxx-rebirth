name: Pull Request - Windows
on:
  workflow_dispatch:
  # Windows packages take a long time to build, so pull requests only get
  # one when they are meant to be play-tested: add the 'playtest' label.
  # The build then also runs for later pushes to that pull request.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
    paths-ignore:
      - 'Documentation/**'
      - 'contrib/gentoo/**'
      - 'contrib/rpm/**'

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Package Windows
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'playtest')
    uses: ./.github/workflows/package-windows.yml
