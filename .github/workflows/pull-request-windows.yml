name: Pull Request - Windows
on:
  workflow_dispatch:
  # Windows packages take a long time to build, so pull requests only get
  # one when they are meant to be play-tested: add the 'playtest' label.
  # The build then also runs for later pushes to that pull request.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - master
      - experimental-netcode
    paths-ignore:
      - 'Documentation/**'
      - 'contrib/gentoo/**'
      - 'contrib/rpm/**'

jobs:
  windows:
    name: Package Windows
    # Adding another label to a playtest pull request must not restart the
    # build, so a 'labeled' event only counts for the playtest label itself.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'playtest') &&
       (github.event.action != 'labeled' || github.event.label.name == 'playtest'))
    # The concurrency group belongs to the job, not to the workflow: a run
    # whose job is skipped (such as the 'opened' event of a pull request
    # created with the playtest label, which arrives next to its
    # 'labeled' event) must not cancel the build that is running.
    concurrency:
      group: ${{ github.workflow_ref }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/package-windows.yml
